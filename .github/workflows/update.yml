name: Update prices and deploy page

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      scrape:
        description: "Re-scrape cfmotoparts.eu (takes ~12 min). Untick to only rebuild the page."
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scrape cfmotoparts.eu
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scrape)
        run: python scrape.py

      - name: Build page
        run: python build.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update accessory prices ($(date -u +%F))"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
